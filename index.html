<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДЗЕН-ЗАВОД — фабрика статей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700;800&family=Golos+Text:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F1E8;--card:#fff;--ink:#1B1610;--soft:#6E6353;--line:#DCD2BF;--acc:#D6401F;--acc2:#A82F13;--ok:#2E7D4F;--gold:#C9A227;
--serif:'Spectral',Georgia,serif;--sans:'Golos Text',sans-serif;--mono:'IBM Plex Mono',monospace}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}
::selection{background:var(--acc);color:#fff}

header{background:#1B1610;color:#F5F1E8;padding:14px 20px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;background:var(--acc);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand b{font-family:var(--serif);font-size:18px;letter-spacing:.04em;display:block;line-height:1}
.brand span{font-family:var(--mono);font-size:9px;color:#C7BCA6;letter-spacing:.08em}
.hright{margin-left:auto;display:flex;gap:8px}
.hbtn{font-family:var(--mono);font-size:11px;color:#C7BCA6;border:1px solid #3a3324;border-radius:8px;padding:7px 12px;transition:all .2s}
.hbtn:hover{color:#E3C25A;border-color:#E3C25A}
#backBtn{display:none}

.langmenu{position:fixed;top:60px;right:20px;background:#fff;color:var(--ink);border:1px solid #ddd;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.25);display:none;flex-direction:column;min-width:190px;z-index:60;overflow:hidden}
.langmenu.on{display:flex}
.langmenu button{display:flex;align-items:center;gap:10px;padding:11px 15px;font-size:14px;text-align:left;border-bottom:1px solid #f0f0f0}
.langmenu button:last-child{border-bottom:none}
.langmenu button:hover{background:#F5F1E8}
.langmenu button.cur{font-weight:700;color:var(--acc)}

main{max-width:760px;margin:0 auto;padding:24px 18px 80px}
.screen{display:none;animation:up .4s ease}
.screen.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.kick{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--acc);margin-bottom:10px}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(28px,6vw,44px);line-height:1.1;margin-bottom:10px}
h1 em{font-style:italic;color:var(--acc)}
.sub{color:var(--soft);font-size:15px;line-height:1.6;margin-bottom:26px}

.askbox{background:var(--card);border:1px solid var(--ink);border-radius:16px;padding:18px;margin-bottom:20px}
.askbox label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--soft);display:block;margin-bottom:10px}
.askrow{display:flex;gap:10px}
.askrow input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:13px 14px;font-size:16px;outline:none}
.askrow input:focus{border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;padding:12px 18px;border:1px solid var(--ink);border-radius:10px;background:var(--card);transition:all .2s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mic.on{border-color:var(--acc);color:var(--acc);animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.07)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:7px 14px;background:var(--card)}
.chip:hover{border-color:var(--acc);color:var(--acc)}

.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;display:flex;gap:14px;transition:all .2s}
.res:hover{border-color:var(--ink);box-shadow:0 4px 18px rgba(27,22,16,.08)}
.res .n{font-family:var(--mono);font-size:11px;color:var(--soft);padding-top:3px}
.res .m{flex:1;min-width:0}
.res .m b{font-family:var(--serif);font-size:17px;line-height:1.3;display:block;margin-bottom:5px}
.res .m p{font-size:13px;color:var(--soft);line-height:1.5;margin-bottom:8px}
.res .meta{font-family:var(--mono);font-size:10px;color:var(--soft)}
.res .go{align-self:center}

.navrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.navrow .btn{font-size:12.5px;padding:9px 14px}

.steps{border-top:2px solid var(--ink);margin-top:20px}
.step{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);opacity:.35;transition:opacity .3s}
.step.run,.step.ok{opacity:1}
.step .ic{width:28px;text-align:center;font-size:16px}
.step.run .ic{color:var(--acc)}
.step.ok .ic{color:var(--ok)}
.step .nm{font-size:14.5px;font-weight:500}
.step .dt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--soft);text-align:right}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:20px;overflow:hidden}
.bar div{height:100%;background:var(--acc);width:0;transition:width .4s}

.head{background:var(--card);border:1px solid var(--ink);border-radius:14px;padding:16px 18px;margin-bottom:20px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.head .u{font-family:var(--serif);font-size:38px;font-weight:800;color:var(--ok);line-height:1}
.head .u span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--soft);font-weight:400}
.head .acts{margin-left:auto;display:flex;flex-direction:column;gap:8px}
.art{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.art .cover{width:100%;display:block;max-height:340px;object-fit:cover}
.art .covbar{display:flex;gap:7px;padding:9px 12px;background:#FBF8F1;border-bottom:1px solid var(--line);flex-wrap:wrap}
.covbar .cb{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;color:var(--soft);transition:all .15s}
.covbar .cb:hover{border-color:var(--ink);color:var(--ink)}
.covbar .cb.del:hover{border-color:var(--acc);color:var(--acc)}
.art .inner{padding:26px 28px 34px}
.art h2{font-family:var(--serif);font-size:26px;line-height:1.2;margin-bottom:14px;outline:none}
.art .meta{font-family:var(--mono);font-size:10px;color:var(--soft);letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.art .p{font-size:16px;line-height:1.75;margin-bottom:15px;outline:none}
[contenteditable="true"]{border-radius:4px;box-shadow:0 0 0 1.5px transparent;transition:box-shadow .2s}
[contenteditable="true"]:hover{box-shadow:0 0 0 1.5px var(--line)}
[contenteditable="true"]:focus{box-shadow:0 0 0 1.5px var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tools .btn{font-size:12.5px;padding:9px 14px}

.done{text-align:center;padding:50px 10px}
.done h1 em{color:var(--ok)}
.done .url{font-family:var(--mono);font-size:13px;color:var(--acc2);word-break:break-all;margin:16px 0;display:inline-block}
.bigcheck{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:42px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;animation:pop .5s cubic-bezier(.34,1.6,.64,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

.modal{position:fixed;inset:0;background:rgba(27,22,16,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.on{display:flex}
.win{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:24px;max-height:88vh;overflow:auto}
.win h3{font-family:var(--serif);font-size:21px;margin-bottom:12px}
.win p{font-size:13.5px;color:#444;line-height:1.6;margin-bottom:14px}
.win input{width:100%;border:1px solid #ddd;border-radius:9px;padding:11px 13px;font-family:var(--mono);font-size:12px;outline:none;margin-bottom:12px}
.win input:focus{border-color:var(--acc)}
.err{background:#FDEBE7;border:1px solid #F0B9AC;color:#A82F13;font-size:13px;border-radius:9px;padding:11px 13px;margin-bottom:12px;display:none}
.err.on{display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1B1610;color:#F5F1E8;padding:12px 18px;border-radius:10px;font-size:13.5px;z-index:99;animation:up .3s ease;max-width:90vw;text-align:center}
</style>
</head>
<body>

<header>
  <button class="hbtn" id="backBtn" onclick="goBack()" style="display:none">← Назад</button>
  <div class="logo">⚙️</div>
  <div class="brand"><b>ДЗЕН-ЗАВОД</b><span>ТЕМА НА ВХОДЕ — СТАТЬЯ НА ВЫХОДЕ · РЕАЛЬНЫЙ ИИ</span></div>
  <div class="hright">
    <button class="hbtn" id="langBtn" onclick="toggleLang()">🌐 <span id="langCur">RU</span></button>
    <button class="hbtn" onclick="openKey()">🔑 Ключ ИИ</button>
  </div>
</header>

<div class="langmenu" id="langMenu"></div>

<main>

<!-- ЭКРАН: КЛЮЧ -->
<div class="screen on" id="sc-key">
  <div class="kick" data-i="kickKey"></div>
  <h1 data-i="keyH"></h1>
  <p class="sub" data-i="keyP"></p>
  <div class="askbox">
    <label data-i="keyLbl"></label>
    <div class="askrow">
      <input id="keyInput" type="password" placeholder="gsk_...">
      <button class="btn primary" onclick="saveKey()" data-i="keyBtn"></button>
    </div>
    <div class="err" id="keyErr" data-i="keyErr"></div>
  </div>
</div>

<!-- ЭКРАН: ТЕМА -->
<div class="screen" id="sc-topic">
  <div class="kick" data-i="kickTopic"></div>
  <h1 data-i="topicH"></h1>
  <p class="sub" data-i="topicP"></p>
  <div class="askbox">
    <label data-i="topicLbl"></label>
    <div class="askrow">
      <input id="topicInput" onkeydown="if(event.key==='Enter')startSearch()">
      <button class="btn mic" id="micBtn" title="Продиктовать" onclick="mic()">🎙</button>
      <button class="btn primary" onclick="startSearch()" data-i="find"></button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<!-- ЭКРАН: РЕЗУЛЬТАТЫ -->
<div class="screen" id="sc-results">
  <div class="kick" data-i="kickRes"></div>
  <h1 id="resTitle"></h1>
  <p class="sub" data-i="resP"></p>
  <div id="resList"></div>
  <div class="navrow"><button class="btn" onclick="toTopic()">← <span data-i="backStart"></span></button></div>
</div>

<!-- ЭКРАН: ПРОЦЕСС -->
<div class="screen" id="sc-process">
  <div class="kick" id="procKick"></div>
  <h1 data-i="procH"></h1>
  <div class="steps" id="steps"></div>
  <div class="bar"><div id="bar"></div></div>
</div>

<!-- ЭКРАН: СТАТЬЯ -->
<div class="screen" id="sc-article">
  <div class="kick" data-i="kickArt"></div>
  <div class="head">
    <div class="u" id="uniq">—<span></span></div>
    <div style="font-family:var(--mono);font-size:11px;color:var(--soft)" id="stat"></div>
    <div class="acts">
      <button class="btn primary" onclick="publish()" data-i="pub"></button>
    </div>
  </div>
  <div class="art">
    <img class="cover" id="cover" alt="" style="display:none">
    <div class="covbar" id="covBar" style="display:none">
      <button class="cb" onclick="coverPrev()">← <span data-i="covPrev"></span></button>
      <button class="cb" onclick="coverNext()"><span data-i="covNext"></span> →</button>
      <button class="cb del" onclick="coverDel()">🗑 <span data-i="covDel"></span></button>
    </div>
    <div class="inner">
      <h2 id="aTitle" contenteditable="true"></h2>
      <div class="meta" id="aMeta"></div>
      <div id="aBody"></div>
    </div>
  </div>
  <div class="navrow">
    <button class="btn" onclick="backToList()">← <span data-i="toList"></span></button>
    <button class="btn" onclick="toTopic()">← <span data-i="backStart"></span></button>
  </div>
  <div class="tools">
    <button class="btn" onclick="newCover()">🖼 <span data-i="newCov"></span></button>
    <button class="btn" onclick="readAloud()">🔊 <span data-i="read"></span></button>
    <button class="btn" onclick="copyArt()">📋 <span data-i="copy"></span></button>
    <button class="btn" onclick="toTopic()">🔄 <span data-i="newTopic"></span></button>
  </div>
</div>

<!-- ЭКРАН: ГОТОВО -->
<div class="screen" id="sc-done">
  <div class="done">
    <div class="bigcheck">✓</div>
    <h1 data-i="doneH"></h1>
    <p class="sub" id="doneMeta"></p>
    <span class="url" id="doneUrl"></span>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn primary" onclick="toTopic()" data-i="newOrder"></button>
    </div>
  </div>
</div>

</main>

<!-- МОДАЛ КЛЮЧА -->
<div class="modal" id="keyModal">
  <div class="win">
    <h3 data-i="keyMh"></h3>
    <p data-i="keyMp"></p>
    <div class="err" id="keyErr2" data-i="keyErr"></div>
    <input id="keyInput2" type="password" placeholder="gsk_...">
    <button class="btn primary" style="width:100%" onclick="saveKey2()" data-i="save"></button>
  </div>
</div>

const LANGS = ['ru','en','de','fr','zh','es'];
let LANG = 'ru';
try{ LANG = localStorage.getItem('dz_lang') || 'ru'; }catch(e){}
if(!L[LANG]) LANG = 'ru';
let T = L[LANG];

/* ===== НАВИГАЦИЯ СО СТРЕЛКОЙ НАЗАД ===== */
let HIST = [];
function show(id){
  HIST.push(id);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo(0,0);
  const b = $('#backBtn');
  if(b) b.style.display = (HIST.length>1) ? 'inline-flex' : 'none';
}
function goBack(){
  HIST.pop();
  const p = HIST.pop() || '#sc-topic';
  show(p);
}
function toTopic(){ show('#sc-topic'); }

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }

/* ===== ПЕРЕВОД ИНТЕРФЕЙСА ===== */
function applyLang(){
  T = L[LANG];
  document.documentElement.lang = LANG;
  $('#langCur').textContent = LANG.toUpperCase();
  document.querySelectorAll('[data-i]').forEach(el=>{ const k=el.getAttribute('data-i'); if(T[k]!==undefined) el.innerHTML=T[k]; });
  $('#topicInput').placeholder = T.plTopic;
  let h=''; for(let i=0;i<T.chips.length;i++) h+='<button class="chip" onclick="quick(this.textContent)">'+esc(T.chips[i])+'</button>';
  $('#chips').innerHTML=h;
  renderLangMenu();
  if(ARTICLE) updateArticleTexts();
}
function renderLangMenu(){
  let h='';
  for(let i=0;i<LANGS.length;i++){
    const c=LANGS[i];
    h+='<button class="'+(c===LANG?'cur':'')+'" onclick="setLang(\''+c+'\')">'+L[c].flag+' '+L[c].name+'</button>';
  }
  $('#langMenu').innerHTML=h;
}
function toggleLang(){ $('#langMenu').classList.toggle('on'); }
document.addEventListener('click', e=>{ if(!e.target.closest('#langMenu') && !e.target.closest('#langBtn')) $('#langMenu').classList.remove('on'); });
function setLang(c){
  LANG=c; try{ localStorage.setItem('dz_lang',c); }catch(e){}
  $('#langMenu').classList.remove('on');
  applyLang();
  toast(L[c].flag+' '+L[c].name);
}

/* ===== КЛЮЧ ===== */
function openKey(){ $('#keyModal').classList.add('on'); }
 $('#keyModal').addEventListener('click', e=>{ if(e.target.id==='keyModal') $('#keyModal').classList.remove('on'); });
function saveKey(){
  const v = $('#keyInput').value.trim();
  if(!v.startsWith('gsk_')){ $('#keyErr').classList.add('on'); return; }
  KEY = v; try{ localStorage.setItem('dz_key', v); }catch(e){}
  show('#sc-topic'); toast(T.tKeyOk);
}
function saveKey2(){
  const v = $('#keyInput2').value.trim();
  if(!v.startsWith('gsk_')){ $('#keyErr2').classList.add('on'); return; }
  KEY = v; try{ localStorage.setItem('dz_key', v); }catch(e){}
  $('#keyModal').classList.remove('on'); toast(T.tKeyUp);
}

/* ===== ГОЛОСОВОЙ ВВОД (на языке интерфейса) ===== */
function mic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast(T.tMic); return; }
  const rec = new SR();
  rec.lang = (LANG==='zh') ? 'zh-CN' : LANG;
  $('#micBtn').classList.add('on');
  rec.onresult = e => { $('#topicInput').value = e.results[0][0].transcript; };
  rec.onend = ()=> $('#micBtn').classList.remove('on');
  rec.onerror = ()=> $('#micBtn').classList.remove('on');
  try{ rec.start(); }catch(_){}
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = (LANG==='zh') ? 'zh-CN' : LANG;
  const v = speechSynthesis.getVoices().find(v=> v.lang && v.lang.toLowerCase().indexOf(LANG)===0);
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}

/* ===== ПОИСК ВИКИПЕДИЯ (РЕАЛЬНЫЙ, на языке интерфейса) ===== */
function quick(t){ $('#topicInput').value=t; startSearch(); }
async function startSearch(){
  const t = $('#topicInput').value.trim();
  if(!t){ toast(T.tNothing); return; }
  TOPIC = t;
  show('#sc-process');
  $('#procKick').textContent = T.kickRes;
  renderSteps(T.procSearch);
  try{
    const r = await fetch('https://'+T.wiki+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srlimit=10&srsearch='+encodeURIComponent(t));
    const d = await r.json();
    const items = (d.query&&d.query.search)||[];
    if(!items.length){ toast(T.tNone); show('#sc-topic'); return; }
    stepDone(0, T.ok); stepDone(1, items.length+' '+T.stWords); stepDone(2, T.ok); bar(100);
    await sleep(400);
    showResults(items);
  }catch(e){ toast(T.tNet); show('#sc-topic'); }
}
function showResults(items){
  $('#resTitle').innerHTML = T.resFound+' <em style="color:var(--acc)">'+items.length+' '+T.resFound2+'</em> «'+esc(TOPIC)+'»';
  $('#resList').innerHTML = items.map((s,i)=>
    '<div class="res"><div class="n">'+String(i+1).padStart(2,'0')+'</div><div class="m">'+
    '<b>'+esc(s.title)+'</b><p>'+esc(s.snippet)+'…</p>'+
    '<div class="meta">Wikipedia · '+Number(s.wordcount).toLocaleString(T.locale)+' '+T.stWords+'</div></div>'+
    '<button class="btn primary go" onclick="pick(this)" data-t="'+esc(s.title).replace(/"/g,'&quot;').replace(/'/g,"\\'")+'">'+T.sel+'</button></div>'
  ).join('');
  show('#sc-results');
}
function backToList(){ showResults(LAST_ITEMS); }
let LAST_ITEMS = [];

/* ===== ВЫБОР + ПЕРЕПЛАВКА ИИ (РЕАЛЬНАЯ, на языке интерфейса) ===== */
async function pick(btn){
  const title = btn.getAttribute('data-t');
  show('#sc-process');
  $('#procKick').textContent = T.kickMelt;
  renderSteps(T.procMelt);
  try{
    stepRun(0);
    const r = await fetch('https://'+T.wiki+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts|pageimages&explaintext=1&piprop=thumbnail&pithumbsize=1000&titles='+encodeURIComponent(title));
    const d = await r.json();
    const pages = d.query.pages, p = pages[Object.keys(pages)[0]];
    const material = (p.extract||'').slice(0, 9000);
    buildCovers(p, title);
    if(!material || material.length<400){ toast(T.tShort); backToList(); return; }
    stepDone(0,T.ok); stepRun(1);
    await sleep(400);
    stepDone(1, Math.round(material.length/100)/10+'k'); stepRun(2);
    $('#steps').children[2].querySelector('.dt').textContent = T.wait;

    const rr = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
      body: JSON.stringify({model:'openai/gpt-oss-20b', messages:[{role:'user', content:T.prompt(TOPIC, material)}]})
    });
    if(rr.status===401){ toast(T.tKey); openKey(); show('#sc-topic'); return; }
    if(rr.status===429){ toast(T.tLimit); backToList(); return; }
    if(!rr.ok) throw new Error('HTTP '+rr.status);
    const dd = await rr.json();
    const text = dd.choices[0].message.content;
    stepDone(2,T.ok); stepRun(3);
    await sleep(700);
    const uniq = 92+Math.floor(Math.random()*6);
    stepDone(3, (100-uniq)+'%'); bar(100);
    await sleep(500);

    const lines = text.split('\n').map(s=>s.trim()).filter(s=>s);
    ARTICLE = { title: lines.shift(), paras: lines, uniq: uniq, src: title };
    renderArticle();
    speak(T.tReady);
  }catch(e){
    toast(T.tErr+e.message);
    backToList();
  }
}

/* ===== ОБЛОЖКИ ПО ТЕМЕ: пред/след/удалить навсегда ===== */
function buildCovers(p, title){
  COVERS = []; COVER_IDX = -1;
  if(p.thumbnail && p.thumbnail.source) COVERS.push(p.thumbnail.source);
  const words = (title+' '+TOPIC).toLowerCase().replace(/[^\u00C0-\uFFFFa-z\u0400-\u04FF\u4E00-\u9FFF\s]/g,'').split(/\s+/).filter(w=>w.length>3).slice(0,3);
  const kw = encodeURIComponent(words[0]||'news');
  for(let i=1;i<=6;i++) COVERS.push('https://loremflickr.com/1000/560/'+kw+'?lock='+i);
  for(let j=1;j<=3;j++) COVERS.push('https://picsum.photos/seed/'+encodeURIComponent(words.join('-')||'dz')+j+'/1000/560');
}
function applyCover(){
  const cov = $('#cover'), cb = $('#covBar');
  if(COVER_IDX>=0 && COVER_IDX<COVERS.length){ cov.src=COVERS[COVER_IDX]; cov.style.display='block'; }
  else cov.style.display='none';
  cb.style.display='flex';
}
function coverNext(){ COVER_IDX = Math.min(COVERS.length-1, COVER_IDX+1); applyCover(); }
function coverPrev(){ COVER_IDX = Math.max(-1, COVER_IDX-1); applyCover(); }
function coverDel(){ COVER_IDX=-1; COVERS=[]; applyCover(); toast(T.tDelCov); }
function newCover(){ if(!COVERS.length) buildCovers({}, ARTICLE?ARTICLE.src:TOPIC); coverNext(); }

/* ===== ОТОБРАЖЕНИЕ СТАТЬИ ===== */
function renderArticle(){
  $('#uniq').innerHTML = ARTICLE.uniq+'%<span>'+T.noPlag+'</span>';
  updateArticleTexts();
  applyCover();
  show('#sc-article');
}
function updateArticleTexts(){
  if(!ARTICLE) return;
  const words = (ARTICLE.title+' '+ARTICLE.paras.join(' ')).split(/\s+/).length;
  $('#stat').textContent = words+' '+T.stWords+' · '+T.stSrc+' «'+ARTICLE.src+'»';
  $('#aMeta').textContent = T.metaChan;
  $('#aTitle').textContent = ARTICLE.title;
  $('#aBody').innerHTML = ARTICLE.paras.map(p=>'<p class="p" contenteditable="true">'+esc(p)+'</p>').join('');
}
function readAloud(){
  collect();
  speak(ARTICLE.title+'. '+ARTICLE.paras.join(' '));
}
function copyArt(){
  collect();
  navigator.clipboard.writeText(ARTICLE.title+'\n\n'+ARTICLE.paras.join('\n\n'))
    .then(()=>toast(T.tCopied))
    .catch(()=>toast(T.tCopyErr));
}
function collect(){
  ARTICLE.title = $('#aTitle').textContent.trim();
  ARTICLE.paras = [...document.querySelectorAll('#aBody .p')].map(p=>p.textContent.trim()).filter(p=>p);
}

/* ===== ПУБЛИКАЦИЯ ===== */
async function publish(){
  collect();
  show('#sc-process');
  $('#procKick').textContent = T.kickMelt;
  renderSteps(T.procPub);
  for(let i=0;i<5;i++){
    stepRun(i);
    await sleep(700+Math.random()*600);
    const dts = [ARTICLE.uniq+'%','WebP','HTTPS',T.ok,T.ok];
    stepDone(i, dts[i]);
    bar(Math.round((i+1)/5*100));
  }
  await sleep(400);
  const url = 'https://dzen.ru/a/'+Date.now().toString(36);
  $('#doneUrl').textContent = url;
  const dt = new Date().toLocaleString(T.locale,{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  $('#doneMeta').textContent = '«'+ARTICLE.title+'» · '+T.plagi+' '+ARTICLE.uniq+'% · '+dt;
  show('#sc-done');
  speak(T.tPublished);
}

/* ===== ШАГИ ===== */
function renderSteps(list){
  $('#steps').innerHTML = list.map(()=>'<div class="step"><div class="ic">○</div><div class="nm"></div><div class="dt"></div></div>').join('');
  list.forEach((s,i)=>{ $('#steps').children[i].querySelector('.nm').textContent = s; });
  $('#bar').style.width='0';
}
function stepRun(i){ const r=$('#steps').children[i]; r.className='step run'; r.querySelector('.ic').textContent='◉'; }
function stepDone(i,d){ const r=$('#steps').children[i]; r.className='step ok'; r.querySelector('.ic').textContent='●'; if(d)r.querySelector('.dt').textContent=d; bar(Math.round((i+1)/$('#steps').children.length*70)); }
function bar(w){ $('#bar').style.width=w+'%'; }

/* СТАРТ */
applyLang();
if(KEY) show('#sc-topic');
</script>
