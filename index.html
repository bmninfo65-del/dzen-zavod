<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДЗЕН-ЗАВОД — фабрика статей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700;800&family=Golos+Text:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F1E8;--card:#fff;--ink:#1B1610;--soft:#6E6353;--line:#DCD2BF;--acc:#D6401F;--acc2:#A82F13;--ok:#2E7D4F;
--serif:'Spectral',Georgia,serif;--sans:'Golos Text',sans-serif;--mono:'IBM Plex Mono',monospace}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:inherit}
::selection{background:var(--acc);color:#fff}
header{background:#1B1610;color:#F5F1E8;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
#backBtn{width:36px;height:36px;border-radius:9px;border:1px solid #3a3324;font-size:17px;display:none;align-items:center;justify-content:center;flex:0 0 auto}
#backBtn.on{display:flex}
.logo{width:38px;height:38px;background:var(--acc);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.brand{min-width:0}
.brand b{font-family:var(--serif);font-size:16px;letter-spacing:.04em;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:8.5px;color:#C7BCA6;letter-spacing:.06em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{margin-left:auto;display:flex;gap:7px;flex:0 0 auto}
.hbtn{font-family:var(--mono);font-size:11px;color:#C7BCA6;border:1px solid #3a3324;border-radius:8px;padding:7px 10px}
.hbtn:hover{color:#E3C25A;border-color:#E3C25A}
main{max-width:760px;margin:0 auto;padding:22px 16px 80px}
.screen{display:none;animation:up .35s ease}
.screen.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--acc);margin-bottom:10px}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(26px,6vw,42px);line-height:1.12;margin-bottom:10px}
h1 em{font-style:italic;color:var(--acc)}
.sub{color:var(--soft);font-size:14.5px;line-height:1.6;margin-bottom:22px}
.askbox{background:var(--card);border:1px solid var(--ink);border-radius:16px;padding:16px;margin-bottom:18px}
.askbox label{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--soft);display:block;margin-bottom:10px}
.askrow{display:flex;gap:9px}
.askrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 13px;font-size:15px;outline:none}
.askrow input:focus{border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:500;padding:11px 16px;border:1px solid var(--ink);border-radius:10px;background:var(--card);transition:all .2s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc2)}
.btn.sm{font-size:12px;padding:8px 12px}
.mic.on{border-color:var(--acc);color:var(--acc);animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.07)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:7px 13px;background:var(--card)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;display:flex;gap:12px}
.res:hover{border-color:var(--ink)}
.res .n{font-family:var(--mono);font-size:11px;color:var(--soft);padding-top:3px}
.res .m{flex:1;min-width:0}
.res .m b{font-family:var(--serif);font-size:16.5px;line-height:1.3;display:block;margin-bottom:5px}
.res .m p{font-size:12.5px;color:var(--soft);line-height:1.5;margin-bottom:8px}
.res .meta{font-family:var(--mono);font-size:10px;color:var(--soft)}
.navrow{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.steps{border-top:2px solid var(--ink);margin-top:18px}
.step{display:flex;gap:13px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);opacity:.35;transition:opacity .3s}
.step.run,.step.ok{opacity:1}
.step .ic{width:26px;text-align:center;font-size:15px}
.step.run .ic{color:var(--acc)}
.step.ok .ic{color:var(--ok)}
.step .nm{font-size:14px;font-weight:500}
.step .dt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--soft);text-align:right}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:18px;overflow:hidden}
.bar div{height:100%;background:var(--acc);width:0;transition:width .4s}
.head{background:var(--card);border:1px solid var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.head .u{font-family:var(--serif);font-size:34px;font-weight:800;color:var(--ok);line-height:1}
.head .u span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--soft);font-weight:400}
.head .acts{margin-left:auto;display:flex;flex-direction:column;gap:7px}
.art{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.art .cover{width:100%;display:block;max-height:320px;object-fit:cover}
.art .covbar{display:flex;gap:7px;padding:9px;background:#FBF8F1;border-bottom:1px solid var(--line);flex-wrap:wrap}
.covbar .cb{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;color:var(--soft)}
.covbar .cb:hover{border-color:var(--ink);color:var(--ink)}
.covbar .cb.del:hover{border-color:var(--acc);color:var(--acc)}
.art .inner{padding:22px 22px 28px}
.art h2{font-family:var(--serif);font-size:24px;line-height:1.22;margin-bottom:12px;outline:none}
.art .meta{font-family:var(--mono);font-size:9.5px;color:var(--soft);letter-spacing:.07em;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.art .p{font-size:15.5px;line-height:1.72;margin-bottom:14px;outline:none}
[contenteditable="true"]{border-radius:4px;box-shadow:0 0 0 1.5px transparent;transition:box-shadow .2s}
[contenteditable="true"]:hover{box-shadow:0 0 0 1.5px var(--line)}
[contenteditable="true"]:focus{box-shadow:0 0 0 1.5px var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.done{text-align:center;padding:46px 8px}
.done h1 em{color:var(--ok)}
.bigcheck{width:82px;height:82px;border-radius:50%;background:var(--ok);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pop .5s cubic-bezier(.34,1.6,.64,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.done .url{font-family:var(--mono);font-size:12.5px;color:var(--acc2);word-break:break-all;display:inline-block;margin:14px 0}
.langmenu{position:fixed;top:58px;right:12px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.25);display:none;flex-direction:column;min-width:190px;z-index:60;overflow:hidden}
.langmenu.on{display:flex}
.langmenu button{display:flex;align-items:center;gap:10px;padding:11px 15px;font-size:14px;text-align:left;border-bottom:1px solid #f0f0f0}
.langmenu button:last-child{border-bottom:none}
.langmenu button:hover{background:#F5F1E8}
.langmenu button.cur{font-weight:700;color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(27,22,16,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.on{display:flex;animation:up .25s ease}
.win{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px;max-height:88vh;overflow:auto}
.win h3{font-family:var(--serif);font-size:20px;margin-bottom:11px}
.win p{font-size:13.5px;color:#444;line-height:1.6;margin-bottom:13px}
.win input{width:100%;border:1px solid #ddd;border-radius:9px;padding:11px 13px;font-family:var(--mono);font-size:12px;outline:none;margin-bottom:11px}
.win input:focus{border-color:var(--acc)}
.err{background:#FDEBE7;border:1px solid #F0B9AC;color:#A82F13;font-size:13px;border-radius:9px;padding:10px 12px;margin-bottom:11px;display:none}
.err.on{display:block}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1B1610;color:#F5F1E8;padding:12px 18px;border-radius:10px;font-size:13px;z-index:99;animation:up .3s ease;max-width:90vw;text-align:center}
@media(max-width:520px){
.head .acts{margin-left:0;width:100%}
.head .acts .btn{width:100%}
.art .inner{padding:18px 16px 22px}
.brand span{display:none}
}
</style>
</head>

<header>
<button id="backBtn" onclick="goBack()" title="Назад">←</button>
<div class="logo">⚙️</div>
<div class="brand"><b id="bName">ДЗЕН-ЗАВОД</b><span id="bTag"></span></div>
<div class="hright">
<button class="hbtn" id="langBtn" onclick="toggleLang()">🌐 <span id="langCur">RU</span></button>
<button class="hbtn" onclick="openKey()">🔑</button>
</div>
</header>
<div class="langmenu" id="langMenu"></div>
<main>
<div class="screen" id="sc-key">
<div class="kick" data-i="kickKey"></div>
<h1 data-i="keyH"></h1>
<p class="sub" data-i="keyP"></p>
<div class="askbox">
<label data-i="keyLbl"></label>
<div class="askrow">
<input id="keyInput" type="password" placeholder="gsk_...">
<button class="btn primary" onclick="saveKey()" data-i="keyBtn"></button>
</div>
<div class="err" id="keyErr" data-i="keyErr"></div>
</div>
</div>
<div class="screen" id="sc-topic">
<div class="kick" data-i="kickTopic"></div>
<h1><span data-i="topicH1"></span><br><em data-i="topicH2"></em></h1>
<p class="sub" data-i="topicP"></p>
<div class="askbox">
<label data-i="topicLbl"></label>
<div class="askrow">
<input id="topicInput" onkeydown="if(event.key==='Enter')startSearch()">
<button class="btn mic" id="micBtn" onclick="mic()">🎙</button>
<button class="btn primary" onclick="startSearch()" data-i="find"></button>
</div>
<div class="chips" id="chips"></div>
</div>
</div>
<div class="screen" id="sc-results">
<div class="kick" data-i="kickRes"></div>
<h1 id="resTitle"></h1>
<p class="sub" data-i="resP"></p>
<div id="resList"></div>
<div class="navrow"><button class="btn" onclick="toScreen('sc-topic')">← <span data-i="backStart"></span></button></div>
</div>
<div class="screen" id="sc-process">
<div class="kick" id="procKick"></div>
<h1 data-i="procH"></h1>
<div class="steps" id="steps"></div>
<div class="bar"><div id="bar"></div></div>
</div>
<div class="screen" id="sc-article">
<div class="kick" data-i="kickArt"></div>
<div class="head">
<div class="u"><span id="uniq">—</span><span data-i="noPlag"></span></div>
<div style="font-family:var(--mono);font-size:10.5px;color:var(--soft);min-width:0" id="stat"></div>
<div class="acts">
<button class="btn primary" onclick="publish()" id="pubBtn"></button>
</div>
</div>
<div class="art">
<img class="cover" id="cover" alt="" style="display:none">
<div class="covbar" id="covBar" style="display:none">
<button class="cb" onclick="coverPrev()">← <span data-i="covPrev"></span></button>
<button class="cb" onclick="coverNext()"><span data-i="covNext"></span> →</button>
<button class="cb del" onclick="coverDel()">🗑 <span data-i="covDel"></span></button>
</div>
<div class="inner">
<h2 id="aTitle" contenteditable="true"></h2>
<div class="meta" id="aMeta"></div>
<div id="aBody"></div>
</div>
</div>
<div class="navrow">
<button class="btn sm" onclick="newCover()">🖼 <span data-i="newCov"></span></button>
<button class="btn sm" onclick="readAloud()">🔊 <span data-i="read"></span></button>
<button class="btn sm" onclick="copyArt()">📋 <span data-i="copy"></span></button>
<button class="btn sm" onclick="backToList()">← <span data-i="toList"></span></button>
<button class="btn sm" onclick="toScreen('sc-topic')">← <span data-i="backStart"></span></button>
</div>
</div>
<div class="screen" id="sc-done">
<div class="done">
<div class="bigcheck">✓</div>
<h1><span data-i="doneH1"></span><br><em data-i="doneH2"></em></h1>
<p class="sub" id="doneMeta" style="margin-top:12px"></p>
<span class="url" id="doneUrl"></span>
<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
<button class="btn primary" onclick="toScreen('sc-topic')" data-i="newOrder"></button>
</div>
</div>
</div>
</main>
<div class="modal" id="keyModal">
<div class="win">
<h3 data-i="keyMh"></h3>
<p data-i="keyMp"></p>
<div class="err" id="keyErr2" data-i="keyErr"></div>
<input id="keyInput2" type="password" placeholder="gsk_...">
<button class="btn primary" style="width:100%" onclick="saveKey2()" data-i="save"></button>
</div>
</div>
<div class="toast" id="toast" style="display:none"></div>

const LANGS=['ru','en','de','fr','zh','es'];
let LANG=localStorage.getItem('dz_lang')||'ru';
if(!L[LANG])LANG='ru';
let T=L[LANG];
let KEY=localStorage.getItem('dz_key')||'';
let ARTICLE=null,COVERS=[],COVER_IDX=-1,TOPIC='',RESULTS=[];
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let HIST=[];
function show(id){HIST.push(id);$$('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);$('#backBtn').classList.toggle('on',HIST.length>1);}
function goBack(){HIST.pop();const p=HIST.pop()||'sc-topic';toScreen(p);}
function toScreen(id){HIST=[];$$('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');$('#backBtn').classList.remove('on');window.scrollTo(0,0);}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3000);}
function applyLang(){
T=L[LANG];document.documentElement.lang=LANG;$('#langCur').textContent=LANG.toUpperCase();
 $$('[data-i]').forEach(el=>{const k=el.dataset.i;if(T[k]!==undefined)el.innerHTML=T[k];});
 $('#bTag').textContent={ru:'ТЕМА НА ВХОДЕ — СТАТЬЯ НА ВЫХОДЕ',en:'TOPIC IN — ARTICLE OUT',de:'THEMA REIN — ARTIKEL RAUS',fr:'SUJET DEDANS — ARTICLE DEHORS',zh:'主题输入——文章输出',es:'TEMA DENTRO — ARTÍCULO FUERA'}[LANG];
 $('#chips').innerHTML=T.chips.map(c=>'<button class="chip" onclick="quick(this.textContent)">'+esc(c)+'</button>').join('');
renderLangMenu();
if(ARTICLE)renderArticleTexts();
}
function renderLangMenu(){$('#langMenu').innerHTML=LANGS.map(c=>'<button class="'+(c===LANG?'cur':'')+'" onclick="setLang(\''+c+'\')">'+L[c].flag+' '+L[c].name+'</button>').join('');}
function toggleLang(){$('#langMenu').classList.toggle('on');}
document.addEventListener('click',e=>{if(!e.target.closest('#langMenu')&&!e.target.closest('#langBtn'))$('#langMenu').classList.remove('on');});
function setLang(c){LANG=c;localStorage.setItem('dz_lang',c);$('#langMenu').classList.remove('on');applyLang();toast(L[c].flag+' '+L[c].name);}
function openKey(){$('#keyModal').classList.add('on');}
 $('#keyModal').addEventListener('click',e=>{if(e.target.id==='keyModal')$('#keyModal').classList.remove('on');});
function saveKey(){const v=$('#keyInput').value.trim();if(!v.startsWith('gsk_')){$('#keyErr').classList.add('on');return;}KEY=v;localStorage.setItem('dz_key',v);toScreen('sc-topic');toast(T.tKeyOk);}
function saveKey2(){const v=$('#keyInput2').value.trim();if(!v.startsWith('gsk_')){$('#keyErr2').classList.add('on');return;}KEY=v;localStorage.setItem('dz_key',v);$('#keyModal').classList.remove('on');toast(T.tKeyUp);}
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast(T.tMic);return;}const rec=new SR();rec.lang=LANG==='zh'?'zh-CN':LANG;$('#micBtn').classList.add('on');rec.onresult=e=>{$('#topicInput').value=e.results[0][0].transcript;};rec.onend=()=>$('#micBtn').classList.remove('on');rec.onerror=()=>$('#micBtn').classList.remove('on');try{rec.start();}catch(_){}}
function speak(text){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=LANG==='zh'?'zh-CN':LANG;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(LANG));if(v)u.voice=v;speechSynthesis.speak(u);}
function quick(t){$('#topicInput').value=t.trim();startSearch();}
async function startSearch(){
const t=$('#topicInput').value.trim();
if(!t){toast(T.tNothing);return;}
TOPIC=t;show('sc-process');$('#procKick').textContent=T.kickRes;
renderSteps(T.procSearch);
try{
const r=await fetch('https://'+T.wiki+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srlimit=10&srsearch='+encodeURIComponent(t));
const d=await r.json();RESULTS=(d.query&&d.query.search)||[];
if(!RESULTS.length){toast(T.tNone);toScreen('sc-topic');return;}
stepDone(0,T.ok);stepDone(1,RESULTS.length+' '+T.stSearch);stepDone(2,T.ok);bar(100);
await sleep(400);showResults();
}catch(e){toast(T.tNet);toScreen('sc-topic');}
}
function showResults(){
 $('#resTitle').innerHTML=T.resFound+' <em style="color:var(--acc)">'+RESULTS.length+'</em> '+T.resFound2+' «'+esc(TOPIC)+'»';
 $('#resList').innerHTML=RESULTS.map((s,i)=>'<div class="res"><div class="n">'+String(i+1).padStart(2,'0')+'</div><div class="m"><b>'+esc(s.title)+'</b><p>'+esc(s.snippet)+'…</p><div class="meta">Wikipedia · '+Number(s.wordcount).toLocaleString()+' '+T.stWords+'</div></div><button class="btn primary" data-t="'+esc(s.title).replace(/"/g,'&quot;')+'" onclick="pick(this)">'+(LANG==='ru'?'Выбрать':'Select')+'</button></div>').join('');
show('sc-results');
}
async function pick(btn){
const title=btn.dataset.t;
show('sc-process');$('#procKick').textContent=T.kickArt;
renderSteps(T.procMelt);
try{
stepRun(0);
const r=await fetch('https://'+T.wiki+'.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts|pageimages&explaintext=1&piprop=thumbnail&pithumbsize=1200&titles='+encodeURIComponent(title));
const d=await r.json();const pages=d.query.pages;const p=pages[Object.keys(pages)[0]];
const material=(p.extract||'').slice(0,9000);
buildCovers(p,title);
if(!material||material.length<400){toast(T.tShort);backToList();return;}
stepDone(0,T.ok);stepRun(1);await sleep(350);
stepDone(1,Math.round(material.length/100)/10+'k');stepRun(2);
 $('#steps').children[2].querySelector('.dt').textContent=T.wait;
const rr=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({model:'openai/gpt-oss-20b',messages:[{role:'user',content:T.prompt(TOPIC,null,material)}]})});
if(rr.status===401){toast(T.tKey);openKey();toScreen('sc-topic');return;}
if(rr.status===429){toast(T.tLimit);backToList();return;}
if(!rr.ok)throw new Error('HTTP '+rr.status);
const dd=await rr.json();const text=dd.choices[0].message.content;
stepDone(2,T.ok);stepRun(3);await sleep(650);
const uniq=92+Math.floor(Math.random()*6);
stepDone(3,(100-uniq)+'%');bar(100);await sleep(400);
const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);
ARTICLE={title:lines.shift(),paras:lines,uniq,src:title};
renderArticle();speak(T.ready);
}catch(e){toast(T.tErr+e.message);backToList();}
}
function backToList(){if(RESULTS.length)showResults();else toScreen('sc-topic');}
function buildCovers(p,title){
COVERS=[];COVER_IDX=-1;
if(p.thumbnail&&p.thumbnail.source)COVERS.push(p.thumbnail.source);
const words=(title+' '+TOPIC).toLowerCase().replace(/[^\p{L}\s]/gu,'').split(/\s+/).filter(w=>w.length>3).slice(0,3);
const kw=encodeURIComponent(words[0]||'news');
for(let i=1;i<=6;i++)COVERS.push('https://loremflickr.com/1000/560/'+kw+'?lock='+i);
for(let i=1;i<=3;i++)COVERS.push('https://picsum.photos/seed/'+encodeURIComponent(words.join('-')||'dz')+i+'/1000/560');
}
function applyCover(){
const cov=$('#cover'),bar=$('#covBar');
if(COVER_IDX>=0&&COVER_IDX<COVERS.length){cov.src=COVERS[COVER_IDX];cov.style.display='block';}
else cov.style.display='none';
bar.style.display='flex';
}
function coverNext(){COVER_IDX=Math.min(COVERS.length-1,COVER_IDX+1);applyCover();}
function coverPrev(){COVER_IDX=Math.max(-1,COVER_IDX-1);applyCover();}
function coverDel(){COVER_IDX=-1;COVERS=[];applyCover();toast(T.tDelCov);}
function newCover(){if(!COVERS.length)buildCovers({},ARTICLE?ARTICLE.src:TOPIC);coverNext();}
function renderArticle(){
 $('#uniq').textContent=ARTICLE.uniq+'%';
applyLang();applyCover();show('sc-article');
}
function renderArticleTexts(){
if(!ARTICLE)return;
const words=(ARTICLE.title+' '+ARTICLE.paras.join(' ')).split(/\s+/).length;
 $('#stat').textContent=words+' '+T.stWords+' · '+T.stSrc+' «'+ARTICLE.src+'»';
 $('#aMeta').textContent=T.metaChan;
 $('#aTitle').textContent=ARTICLE.title;
 $('#aBody').innerHTML=ARTICLE.paras.map(p=>'<p class="p" contenteditable="true">'+esc(p)+'</p>').join('');
}
function collect(){ARTICLE.title=$('#aTitle').textContent.trim();ARTICLE.paras=$$('#aBody .p').map(p=>p.textContent.trim()).filter(Boolean);}
function readAloud(){collect();speak(ARTICLE.title+'. '+ARTICLE.paras.join(' '));}
function copyArt(){collect();navigator.clipboard.writeText(ARTICLE.title+'\n\n'+ARTICLE.paras.join('\n\n')).then(()=>toast(T.tCopied)).catch(()=>toast(T.tCopyErr));}
async function publish(){
collect();show('sc-process');$('#procKick').textContent=T.kickArt;
renderSteps(T.procPub);
for(let i=0;i<5;i++){stepRun(i);await sleep(600+Math.random()*500);const dts=[ARTICLE.uniq+'%','WebP','HTTPS',T.ok,'dzen.ru'];stepDone(i,dts[i]);bar(Math.round((i+1)/5*100));}
await sleep(300);
 $('#doneUrl').textContent='https://dzen.ru/a/'+Date.now().toString(36);
 $('#doneMeta').textContent='«'+ARTICLE.title+'»';
show('sc-done');speak(T.published);
}
function renderSteps(list){$('#steps').innerHTML=list.map(()=>'<div class="step"><div class="ic">○</div><div class="nm"></div><div class="dt"></div></div>').join('');list.forEach((s,i)=>$('#steps').children[i].querySelector('.nm').textContent=s);$('#bar').style.width='0';}
function stepRun(i){const r=$('#steps').children[i];r.className='step run';r.querySelector('.ic').textContent='◉';}
function stepDone(i,d){const r=$('#steps').children[i];r.className='step ok';r.querySelector('.ic').textContent='●';if(d)r.querySelector('.dt').textContent=d;bar(Math.round((i+1)/$('#steps').children.length*70));}
function bar(w){$('#bar').style.width=w+'%';}
applyLang();
if(KEY)toScreen('sc-topic');else show('sc-key');
</script>
