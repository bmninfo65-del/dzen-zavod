<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДЗЕН-ЗАВОД v10 — фабрика статей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700;800&family=Golos+Text:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F1E8;--card:#fff;--ink:#1B1610;--soft:#6E6353;--line:#DCD2BF;--acc:#D6401F;--acc2:#A82F13;--ok:#2E7D4F;--serif:'Spectral',Georgia,serif;--sans:'Golos Text',sans-serif;--mono:'IBM Plex Mono',monospace}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;color:inherit}
header{background:#1B1610;color:#F5F1E8;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
#backBtn{width:36px;height:36px;border-radius:9px;border:1px solid #3a3324;font-size:17px;display:none;align-items:center;justify-content:center;flex:0 0 auto;color:#C7BCA6}
#backBtn.on{display:flex}
.logo{width:38px;height:38px;background:var(--acc);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.brand{min-width:0}
.brand b{font-family:var(--serif);font-size:16px;letter-spacing:.04em;display:block;line-height:1.1}
.brand .v{color:#E3C25A;font-family:var(--mono);font-size:10px}
.brand span{font-family:var(--mono);font-size:8.5px;color:#C7BCA6;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{margin-left:auto;display:flex;gap:7px;flex:0 0 auto}
.hbtn{font-family:var(--mono);font-size:11px;color:#C7BCA6;border:1px solid #3a3324;border-radius:8px;padding:7px 10px}
main{max-width:760px;margin:0 auto;padding:22px 16px 80px}
.screen{display:none;animation:up .35s ease}
.screen.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--acc);margin-bottom:10px}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(26px,6vw,42px);line-height:1.12;margin-bottom:10px}
h1 em{font-style:italic;color:var(--acc)}
.sub{color:var(--soft);font-size:14.5px;line-height:1.6;margin-bottom:22px}
.askbox{background:var(--card);border:1px solid var(--ink);border-radius:16px;padding:16px;margin-bottom:18px}
.askbox label{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--soft);display:block;margin-bottom:10px}
.askrow{display:flex;gap:9px}
.askrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 13px;font-size:15px;outline:none}
.askrow input:focus{border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:500;padding:11px 16px;border:1px solid var(--ink);border-radius:10px;background:var(--card)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{font-size:12px;padding:8px 12px}
.mic.on{border-color:var(--acc);color:var(--acc);animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.07)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:7px 13px;background:var(--card)}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;display:flex;gap:12px}
.res .n{font-family:var(--mono);font-size:11px;color:var(--soft);padding-top:3px}
.res .m{flex:1;min-width:0}
.res .m b{font-family:var(--serif);font-size:16.5px;line-height:1.3;display:block;margin-bottom:5px}
.res .m p{font-size:12.5px;color:var(--soft);line-height:1.5;margin-bottom:8px}
.res .meta{font-family:var(--mono);font-size:10px;color:var(--soft)}
.navrow{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.steps{border-top:2px solid var(--ink);margin-top:18px}
.step{display:flex;gap:13px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);opacity:.35;transition:opacity .3s}
.step.run,.step.ok{opacity:1}
.step .ic{width:26px;text-align:center;font-size:15px}
.step.run .ic{color:var(--acc)}
.step.ok .ic{color:var(--ok)}
.step .nm{font-size:14px;font-weight:500}
.step .dt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--soft);text-align:right}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:18px;overflow:hidden}
.bar div{height:100%;background:var(--acc);width:0;transition:width .4s}
.dhead{background:var(--card);border:1px solid var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.dhead .u{font-family:var(--serif);font-size:34px;font-weight:800;color:var(--ok);line-height:1}
.dhead .u span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--soft);font-weight:400}
.dhead .acts{margin-left:auto;display:flex;flex-direction:column;gap:7px}
.art{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.art .cover{width:100%;display:block;max-height:320px;object-fit:cover}
.art .covbar{display:flex;gap:7px;padding:9px;background:#FBF8F1;border-bottom:1px solid var(--line);flex-wrap:wrap}
.covbar .cb{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;color:var(--soft)}
.covbar .cb.del:hover{border-color:var(--acc);color:var(--acc)}
.art .inner{padding:22px 22px 28px}
.art h2{font-family:var(--serif);font-size:24px;line-height:1.22;margin-bottom:12px;outline:none}
.art .meta{font-family:var(--mono);font-size:9.5px;color:var(--soft);letter-spacing:.07em;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.art .p{font-size:15.5px;line-height:1.72;margin-bottom:14px;outline:none}
[contenteditable]{border-radius:4px;box-shadow:0 0 0 1.5px transparent;transition:box-shadow .2s}
[contenteditable]:hover{box-shadow:0 0 0 1.5px var(--line)}
[contenteditable]:focus{box-shadow:0 0 0 1.5px var(--acc)}
.done{text-align:center;padding:46px 8px}
.done h1 em{color:var(--ok)}
.bigcheck{width:82px;height:82px;border-radius:50%;background:var(--ok);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.done .url{font-family:var(--mono);font-size:12.5px;color:var(--acc2);word-break:break-all;display:inline-block;margin:14px 0}
.langmenu{position:fixed;top:58px;right:12px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.25);display:none;flex-direction:column;min-width:190px;z-index:60}
.langmenu.on{display:flex}
.langmenu button{display:flex;align-items:center;gap:10px;padding:11px 15px;font-size:14px;text-align:left;border-bottom:1px solid #f0f0f0}
.langmenu button:last-child{border-bottom:none}
.langmenu button.cur{font-weight:700;color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(27,22,16,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.on{display:flex;animation:up .25s ease}
.win{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px;max-height:88vh;overflow:auto}
.win h3{font-family:var(--serif);font-size:20px;margin-bottom:11px}
.win p{font-size:13.5px;color:#444;line-height:1.6;margin-bottom:13px}
.win input{width:100%;border:1px solid #ddd;border-radius:9px;padding:11px 13px;font-family:var(--mono);font-size:12px;outline:none;margin-bottom:11px}
.err{background:#FDEBE7;border:1px solid #F0B9AC;color:#A82F13;font-size:13px;border-radius:9px;padding:10px 12px;margin-bottom:11px;display:none}
.err.on{display:block}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1B1610;color:#F5F1E8;padding:12px 18px;border-radius:10px;font-size:13px;z-index:99;max-width:90vw;text-align:center;display:none}
@media(max-width:520px){.dhead .acts{margin-left:0;width:100%}.dhead .acts .btn{width:100%}.art .inner{padding:18px 16px 22px}.brand span{display:none}}
</style>
</head>
<body>
<header>
<button id="backBtn" onclick="goBack()">←</button>
<div class="logo">⚙️</div>
<div class="brand"><b>ДЗЕН-ЗАВОД <span class="v">v10</span></b><span id="bTag"></span></div>
<div class="hright">
<button class="hbtn" id="langBtn" onclick="toggleLang()">🌐 <span id="langCur">RU</span></button>
<button class="hbtn" onclick="openKey()">🔑</button>
</div>
</header>
<div class="langmenu" id="langMenu"></div>
<main>
<div class="screen" id="sc-key">
<div class="kick" data-i="kickKey"></div>
<h1 data-i="keyH"></h1>
<p class="sub" data-i="keyP"></p>
<div class="askbox">
<label data-i="keyLbl"></label>
<div class="askrow">
<input id="keyInput" type="password" placeholder="gsk_...">
<button class="btn primary" onclick="saveKey()" data-i="keyBtn"></button>
</div>
<div class="err" id="keyErr" data-i="keyErr"></div>
</div>
</div>
<div class="screen" id="sc-topic">
<div class="kick" data-i="kickTopic"></div>
<h1><span data-i="topicH1"></span><br><em data-i="topicH2"></em></h1>
<p class="sub" data-i="topicP"></p>
<div class="askbox">
<label data-i="topicLbl"></label>
<div class="askrow">
<input id="topicInput" onkeydown="if(event.key==='Enter')startSearch()">
<button class="btn mic" id="micBtn" onclick="mic()">🎙</button>
<button class="btn primary" onclick="startSearch()" data-i="find"></button>
</div>
<div class="chips" id="chips"></div>
</div>
</div>
<div class="screen" id="sc-results">
<div class="kick" data-i="kickRes"></div>
<h1 id="resTitle"></h1>
<p class="sub" data-i="resP"></p>
<div id="resList"></div>
<div class="navrow"><button class="btn" onclick="toTopic()">← <span data-i="backStart"></span></button></div>
</div>
<div class="screen" id="sc-process">
<div class="kick" id="procKick"></div>
<h1 data-i="procH"></h1>
<div class="steps" id="steps"></div>
<div class="bar"><div id="bar"></div></div>
</div>
<div class="screen" id="sc-article">
<div class="kick" data-i="kickArt"></div>
<div class="dhead">
<div class="u"><span id="uniq">—</span><span data-i="noPlag"></span></div>
<div style="font-family:var(--mono);font-size:10.5px;color:var(--soft)" id="stat"></div>
<div class="acts"><button class="btn primary" onclick="publish()" id="pubBtn"></button></div>
</div>
<div class="art">
<img class="cover" id="cover" alt="" style="display:none">
<div class="covbar" id="covBar" style="display:none">
<button class="cb" onclick="coverPrev()">← <span data-i="covPrev"></span></button>
<button class="cb" onclick="coverNext()"><span data-i="covNext"></span> →</button>
<button class="cb del" onclick="coverDel()">🗑 <span data-i="covDel"></span></button>
</div>
<div class="inner">
<h2 id="aTitle" contenteditable="true"></h2>
<div class="meta" id="aMeta"></div>
<div id="aBody"></div>
</div>
</div>
<div class="navrow">
<button class="btn sm" onclick="newCover()">🖼 <span data-i="newCov"></span></button>
<button class="btn sm" onclick="readAloud()">🔊 <span data-i="read"></span></button>
<button class="btn sm" onclick="copyArt()">📋 <span data-i="copy"></span></button>
<button class="btn sm" onclick="backToList()">← <span data-i="toList"></span></button>
<button class="btn sm" onclick="toTopic()">← <span data-i="backStart"></span></button>
</div>
</div>
<div class="screen" id="sc-done">
<div class="done">
<div class="bigcheck">✓</div>
<h1><span data-i="doneH1"></span><br><em data-i="doneH2"></em></h1>
<p class="sub" id="doneMeta" style="margin-top:12px"></p>
<span class="url" id="doneUrl"></span>
<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
<button class="btn primary" onclick="toTopic()" data-i="newOrder"></button>
</div>
</div>
</div>
</main>
<div class="modal" id="keyModal">
<div class="win">
<h3 data-i="keyMh"></h3>
<p data-i="keyMp"></p>
<div class="err" id="keyErr2" data-i="keyErr"></div>
<input id="keyInput2" type="password" placeholder="gsk_...">
<button class="btn primary" style="width:100%" onclick="saveKey2()" data-i="save"></button>
</div>
</div>
<div class="toast" id="toast"></div>

r.classList.add('run');
setTimeout(function(){
r.classList.remove('run');r.classList.add('ok');
r.querySelector('.ic').textContent='●';
var dts=[ARTICLE.uniq+'%','WebP','HTTPS',T.ok,'dzen.ru'];
r.querySelector('.dt').textContent=dts[i];
i++;bar(Math.round(i/5*100));next();
},650+Math.random()*400);
}
next();
}
function renderSteps(list){
var h='';
for(var i=0;i<list.length;i++)h+='<div class="step"><div class="ic">○</div><div class="nm"></div><div class="dt"></div></div>';
 $('#steps').innerHTML=h;
var rows=$$('#steps .step');
for(var j=0;j<list.length;j++)rows[j].querySelector('.nm').textContent=list[j];
 $('#bar').style.width='0';
}
function stepDone(i,d){var rows=$$('#steps .step');rows[i].classList.add('ok');rows[i].querySelector('.ic').textContent='●';if(d)rows[i].querySelector('.dt').textContent=d;bar(Math.round((i+1)/rows.length*70));}
function bar(w){var b=$('#bar');if(b)b.style.width=w+'%';}
/* === СТАРТ === */
applyLang();
if(KEY){show('sc-topic');}else{show('sc-key');}
</script>
